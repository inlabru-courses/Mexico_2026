website:
  title: "`inlabru` workshop"
  navbar:
    logo: Image/Inlabru_logo.png
    right:
    - text: GitHub
      href: https://github.com/ # replace with github repo URL
    left:
    - text: Home
      href: index.qmd
    - text: Installation
      href: Install_software.qmd
    - text: Slides
      menu:
      - text: Welcome to the Course
        href: slides/welcome.qmd
      - text: Session 1 - Introduction to inlabru
        href: slides/slides_1.qmd
      - text: Session 2 - The inlabru workflow
        href: slides/slides_2.qmd
      - text: Session 3 - Time Series Models
        href: slides/slides_3.qmd
      - text: Recap
        href: slides/slides_recap1.qmd
      - text: Session 4 - Geostatistics and the SPDE approach
        href: slides/slides_geostats.qmd
      - text: Session 5 - Point Processes
        href: slides/slides_points.qmd
      - text: Closing Remarks
        href: slides/slides_Closing_Remarks.qmd
    - text: Practicals
      menu:
      - text: Practical 1 - Linear (Mixed) Models
        href: practicals/LMM_ex.qmd
      - text: Practical 2 - Generalised Linear (Mixed) Models
        href: practicals/GLMM_fit.qmd
      - text: Practical 3 - Temporal Models
        href: day2_practical_3.qmd
      - text: Practical 4 - Geostatistics
        href: practicals/Geostat_ex.qmd
      - text: Practical 5 - Point Processes
        href: day3_practical_5.qmd
    - text: Supplementary Material
      href: INLA_nutshell.qmd
    - text: References
